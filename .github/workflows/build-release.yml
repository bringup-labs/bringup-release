name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release (for staging)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [macOS]
            build_cmd: build:mac
            platform: mac
          - os: [Linux]
            build_cmd: build:linux
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: lib/bringup-daemon/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── macOS code-signing setup ────────────────────────────────────────────
      # Decodes the self-signed .p12 from secrets into a temporary keychain so
      # that electron-osx-sign / codesign can find the identity without a GUI.
      - name: Import signing certificate (macOS only)
        if: matrix.platform == 'mac'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Decode the base64 secret back into a .p12 file
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"

          # Create a temporary keychain with a known password
          security create-keychain -p "gh-actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "gh-actions" "$KEYCHAIN_PATH"

          # Import the certificate; -A allows any application to use it
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Prepend the temp keychain to the user search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Allow codesign to access the key without an interactive prompt
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "gh-actions" "$KEYCHAIN_PATH"

          # Clean up the decoded cert file immediately
          rm -f "$CERT_PATH"

      - name: Build daemon binaries (mac)
        if: matrix.platform == 'mac'
        run: ./scripts/copy-daemon.sh darwin universal

      - name: Build daemon binaries (linux)
        if: matrix.platform == 'linux'
        run: ./scripts/copy-daemon.sh linux amd64

      - name: Build Vite
        run: npm run vite:build:app

      # Build, sign, notarize, and staple — but do NOT upload yet.
      # afterSign notarizes+staples the .app; afterAllArtifactBuild notarizes+staples the .pkg.
      # We upload after stapling so S3 gets the final file (stapling changes the sha512).
      - name: Build (mac)
        if: matrix.platform == 'mac'
        env:
          BRINGUP_ALLOW_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          # CSC_NAME signs the .app; CSC_INSTALLER_NAME signs the .pkg.
          # Both must match the certificate Common Names exactly.
          CSC_NAME: "Rahul Katiyar (F5YXN979Q6)"
          CSC_INSTALLER_NAME: "Rahul Katiyar (F5YXN979Q6)"
          CSC_KEYCHAIN: "${{ runner.temp }}/build.keychain"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never
        shell: bash

      - name: Upload artifacts (mac)
        if: matrix.platform == 'mac'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp dist/ s3://bringup-releases/ \
            --endpoint-url https://storage.bringup.dev \
            --recursive \
            --exclude "*" \
            --include "*.pkg" \
            --include "*.zip" \
            --include "*.blockmap" \
            --include "latest-mac.yml"
        shell: bash

      - name: Publish (linux)
        if: matrix.platform == 'linux'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BRINGUP_ALLOW_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: npx electron-builder --linux --publish always
        shell: bash

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Delete temporary keychain (macOS only)
        if: matrix.platform == 'mac' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
