name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release (for staging)'
        required: false
        default: false
        type: boolean
      daemon_only:
        description: 'Build only daemon'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            publish_cmd: publish:mac
            platform: mac
          - os: ubuntu-latest
            publish_cmd: publish:linux
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: apps/bringup_desktop_app/lib/bringup-daemon/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: apps/bringup_desktop_app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/bringup_desktop_app

      # ── macOS code-signing setup ────────────────────────────────────────────
      # Decodes the self-signed .p12 from secrets into a temporary keychain so
      # that electron-osx-sign / codesign can find the identity without a GUI.
      - name: Import signing certificate (macOS only)
        if: matrix.platform == 'mac'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Decode the base64 secret back into a .p12 file
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"

          # Create a temporary keychain with a known password
          security create-keychain -p "gh-actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "gh-actions" "$KEYCHAIN_PATH"

          # Import the certificate. -A lets ANY tool use the imported keys
          # without an interactive keychain prompt. This must cover the .pkg
          # signing tools (productbuild / productsign / pkgbuild), not just
          # codesign — otherwise .pkg signing blocks on a GUI authorization
          # dialog that a headless CI runner can never answer (silent hang).
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -A

          # Prepend the temp keychain to the user search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Allow codesign to access the key without an interactive prompt
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "gh-actions" "$KEYCHAIN_PATH"

          # Clean up the decoded cert file immediately
          rm -f "$CERT_PATH"

      # Drives the whole pipeline from the desktop app's package.json so the
      # build logic stays in one place. publish:mac runs the daemon build,
      # Vite build, electron-builder (sign + notarize + staple via the afterSign
      # / afterAllArtifactBuild hooks, --publish never), then uploads the
      # stapled artifacts to S3. publish:linux builds + publishes each arch.
      - name: Build & publish
        if: github.event.inputs.daemon_only != 'true'
        timeout-minutes: 45
        working-directory: apps/bringup_desktop_app
        shell: bash
        env:
          BRINGUP_ALLOW_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          # CSC_NAME signs the .app and the daemon binary; CSC_INSTALLER_NAME
          # signs the .pkg. Both must match the certificate Common Names exactly.
          CSC_NAME: "Rahul Katiyar (F5YXN979Q6)"
          CSC_INSTALLER_NAME: "Rahul Katiyar (F5YXN979Q6)"
          CSC_KEYCHAIN: "${{ runner.temp }}/build.keychain"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: npm run ${{ matrix.publish_cmd }}

      # ── Standalone daemon publishing (mac) ──────────────────────────────────
      - name: Build standalone daemon (mac)
        if: matrix.platform == 'mac'
        env:
          CSC_NAME: "Rahul Katiyar (F5YXN979Q6)"
          CSC_KEYCHAIN: "${{ runner.temp }}/build.keychain"
        run: ./scripts/publish-daemon.sh darwin
        working-directory: apps/bringup_desktop_app
        shell: bash

      - name: Upload standalone daemon (mac)
        if: matrix.platform == 'mac'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp dist/daemon/ s3://bringup-releases/daemon/ \
            --endpoint-url https://storage.bringup.dev \
            --recursive \
            --exclude "*" \
            --include "*bringupd-darwin-*"
        working-directory: apps/bringup_desktop_app
        shell: bash

      - name: Upload daemon checksums artifact (mac)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: daemon-sha-mac
          path: apps/bringup_desktop_app/dist/daemon/**/*.sha256

      # ── Standalone daemon publishing (linux) ────────────────────────────────
      - name: Build standalone daemon (linux)
        if: matrix.platform == 'linux'
        run: ./scripts/publish-daemon.sh linux
        working-directory: apps/bringup_desktop_app
        shell: bash

      - name: Upload standalone daemon (linux)
        if: matrix.platform == 'linux'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          # Three artifact families, all under dist/daemon/<version>/:
          #   bringupd-linux-*    daemon binary (+ .sha256 sidecar)
          #   bringup-linux-*     CLI used by `bringup register / uninstall`
          #   bringupd.service    systemd unit (single file shared across arches)
          # Pattern note: "*bringup-linux-*" does NOT match "*bringupd-linux-*"
          # because the daemon name has a trailing 'd' before the next hyphen.
          aws s3 cp dist/daemon/ s3://bringup-releases/daemon/ \
            --endpoint-url https://storage.bringup.dev \
            --recursive \
            --exclude "*" \
            --include "*bringupd-linux-*" \
            --include "*bringup-linux-*" \
            --include "*bringupd.service*"
        working-directory: apps/bringup_desktop_app
        shell: bash

      - name: Upload daemon checksums artifact (linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: daemon-sha-linux
          path: apps/bringup_desktop_app/dist/daemon/**/*.sha256

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Delete temporary keychain (macOS only)
        if: always() && matrix.platform == 'mac'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
        working-directory: apps/bringup_desktop_app

  # ── Combine per-platform daemon checksums into a single manifest ──────────────
  publish-daemon-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Download daemon checksum artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: daemon-sha-*
          merge-multiple: true
          path: apps/bringup_desktop_app/dist/daemon

      - name: Generate manifest
        run: ./scripts/gen-daemon-manifest.sh
        working-directory: apps/bringup_desktop_app
        shell: bash

      - name: Publish manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp dist/daemon/manifest.yml s3://bringup-releases/daemon/manifest.yml \
            --endpoint-url https://storage.bringup.dev
        working-directory: apps/bringup_desktop_app
        shell: bash
