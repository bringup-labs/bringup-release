version: "3.8"

services:
  ingress:
    image: traefik:v2.11
    container_name: bringup-ingress
    restart: always
    command:
      - "--ping=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/traefik/tls.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs/tls.yml:/traefik/tls.yml:ro
      - ./certs/cert.pem:/certs/cert.pem:ro
      - ./certs/key.pem:/certs/key.pem:ro
    networks:
      - bagmaster_net

  frontend:
    image: ghcr.io/bringup-labs/bringup-ui:latest
    networks:
      - bagmaster_net
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - ./README.md:/data/license/license.json
    extra_hosts:
      - "idp.bringup.localhost:host-gateway"
      - "api.bringup.localhost:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.bringup.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
      - NEXT_PUBLIC_VISUALIZER_URL=https://visualizer.bringup.localhost
      - API_BASE_URL=https://api.bringup.localhost
      - VISUALIZER_URL=https://visualizer.bringup.localhost
      - KC_CLIENT_ID=next-auth-client
      - KC_CLIENT_SECRET=next-auth-secret-change-in-production
      - KC_ISSUER=https://idp.bringup.localhost/realms/bringuplabs
      - KC_REDIRECT_URI=https://app.bringup.localhost/api/auth/callback

  api_gateway:
    image: ghcr.io/bringup-labs/bringup-gateway
    environment:
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    extra_hosts:
      - "idp.bringup.localhost:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api_gateway.rule=Host(`api.bringup.localhost`)"
      - "traefik.http.routers.api_gateway.entrypoints=websecure"
      - "traefik.http.services.api_gateway.loadbalancer.server.port=8000"
    networks:
      - bagmaster_net

  transpiler_service:
    image: ghcr.io/bringup-labs/bringup-transpiler
    environment:
      - FLOW_SERVICE_URL=http://flow_service:8000
      - DEFAULT_DOCKER_NETWORK=bagmaster_net
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8600:8000"
    networks:
      - bagmaster_net

  flow_service:
    image: ghcr.io/bringup-labs/bringup-flow
    environment:
      - DATABASE_URL=postgres://postgres:postgres@flow_db:5432/bagmaster_flows?sslmode=disable
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      flow_db:
        condition: service_healthy
    networks:
      - bagmaster_net

  flow_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_flows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - flow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  action_service:
    image: ghcr.io/bringup-labs/bringup-action
    user: "0:0" # Root for Docker socket access
    environment:
      - DATABASE_URL=postgres://postgres:postgres@action_db:5432/bagmaster_action?sslmode=disable
      - API_PREFIX=/actions
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=bagmaster-storage
      - MINIO_USE_SSL=false
      - DOCKER_NETWORK=bagmaster_net
      - NOTEBOOK_IMAGE=bagmaster-action-notebook:latest
      - AGENT_EXECUTION_SECRET_KEY=anothersecretkey
      - JENKINS_URL=http://bringup-engine:8080
      - JENKINS_ADMIN_USER=admin
      - JENKINS_ADMIN_PASSWORD=admin12345
      - JENKINS_WEBHOOK_TOKEN=randomtoken
      - API_GATEWAY_URL=http://api_gateway:8000
      - ROSBAG_SERVICE_URL=http://rosbag_service:8000
      - PROXY_HOST_ADDRESS=host.docker.internal
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8500:8000"
    depends_on:
      action_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      bringup-engine:
        condition: service_healthy
    networks:
      - bagmaster_net

  action_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_action
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - action_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  auth_service:
    image: ghcr.io/bringup-labs/bringup-auth
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@auth_db:5432/bagmaster_auth?sslmode=disable
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=password
      - FLOW_SERVICE_BOOTSTRAP_URL=http://api_gateway:8000/flows/bootstrap/examples
      - ROSBAG_SERVICE_BOOTSTRAP_URL=http://api_gateway:8000/rosbags/bootstrap/starter
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      auth_db:
        condition: service_healthy
    networks:
      - bagmaster_net

  auth_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  experiment_service:
    image: ghcr.io/bringup-labs/bringup-experiment
    environment:
      - DATABASE_URL=postgres://postgres:postgres@experiment_db:5432/bagmaster_experiment?sslmode=disable
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      experiment_db:
        condition: service_healthy
    networks:
      - bagmaster_net

  experiment_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_experiment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - experiment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  rosbag_service:
    image: ghcr.io/bringup-labs/bringup-rosbag
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:postgres@rosbag_db:5432/bagmaster_rosbag?sslmode=disable
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
    depends_on:
      rosbag_db:
        condition: service_healthy
    networks:
      - bagmaster_net

  rosbag_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_rosbag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rosbag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net


  storage_service:
    image: ghcr.io/bringup-labs/bringup-storage
    environment:
      - DATABASE_URL=postgres://postgres:postgres@storage_db:5432/bagmaster_storage?sslmode=disable
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_ENDPOINT_URL=https://s3.bringup.localhost
      - AWS_S3_EXTERNAL_ENDPOINT_URL=https://s3.bringup.localhost
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_STORAGE_BUCKET_NAME=bagmaster-storage
      - DEFAULT_STORAGE_QUOTA_BYTES=549755813888
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    extra_hosts:
      - "s3.bringup.localhost:host-gateway"
    ports:
      - "8400:8000"
    depends_on:
      minio_createbucket:
        condition: service_completed_successfully
      storage_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  storage_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bagmaster_storage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - storage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bagmaster_net

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    volumes:
      - minio_data:/data
      - ${PWD}/configs/minio/minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.bringup.localhost`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    networks:
      - bagmaster_net

  minio_createbucket:
    image: pgsty/mc:RELEASE.2026-03-21T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./configs/minio/cors.xml:/tmp/cors.xml:ro
    entrypoint: >
      /bin/sh -c "
      echo 'Setting up MinIO alias...';
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      echo 'Creating bucket if it does not exist...';
      /usr/bin/mc mb myminio/bagmaster-storage 2>/dev/null || echo 'Bucket already exists, continuing...';
      echo 'Setting bucket policy to public...';
      /usr/bin/mc anonymous set public myminio/bagmaster-storage || echo 'Policy already set or failed, continuing...';
      echo 'Setting CORS configuration on bucket...';
      /usr/bin/mc cors set myminio/bagmaster-storage /tmp/cors.xml && echo 'CORS configured successfully' || echo 'CORS config failed, continuing...';
      echo 'Verifying CORS configuration...';
      /usr/bin/mc cors get myminio/bagmaster-storage || echo 'No CORS configuration found';
      echo 'MinIO setup completed successfully';
      exit 0;
      "
    networks:
      - bagmaster_net

  bringup-engine:
    image: ghcr.io/bringup-labs/pipeline-engine
    container_name: bringup-engine
    user: "0:0"
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_URL=http://bringup-engine:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bringup-engine.rule=Host(`pipeline.bringup.localhost`)"
      - "traefik.http.routers.bringup-engine.entrypoints=websecure"
      - "traefik.http.services.bringup-engine.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - bagmaster_net

  idp:
    image: ghcr.io/bringup-labs/bringup-idp
    container_name: idp-local
    environment:
      KC_HOSTNAME: idp.bringup.localhost
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.idp.rule=Host(`idp.bringup.localhost`)"
      - "traefik.http.routers.idp.entrypoints=websecure"
      - "traefik.http.services.idp.loadbalancer.server.port=8080"
    networks:
      - bagmaster_net

  visualizer:
    image: ghcr.io/bringup-labs/visualizer
    environment:
      - API_URL=https://api.bringup.localhost
      - BAGMASTER_API_UPSTREAM=https://api.bringup.localhost
      - BAGMASTER_KEYCLOAK_URL=https://idp.bringup.localhost
      - BAGMASTER_KEYCLOAK_REALM=bringuplabs
      - BAGMASTER_KEYCLOAK_CLIENT_ID=bringup-client
      - REQUESTS_CA_BUNDLE=/certs/rootCA.pem
      - SSL_CERT_FILE=/certs/rootCA.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.visualizer.rule=Host(`visualizer.bringup.localhost`)"
      - "traefik.http.routers.visualizer.entrypoints=websecure"
      - "traefik.http.services.visualizer.loadbalancer.server.port=8080"
    networks:
      - bagmaster_net

networks:
  bagmaster_net:
    name: bagmaster_net
    driver: bridge
    attachable: true

volumes:
  auth_postgres_data:
  experiment_postgres_data:
  rosbag_postgres_data:
  storage_postgres_data:
  action_postgres_data:
  flow_postgres_data:
  jenkins_home:
  minio_data:
